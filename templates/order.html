<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заявка #{{ order_id }} — Crypto Exchange</title><link rel="stylesheet" href="/static/site.css"></head><body><header><div class="nav"><a class="logo" href="/">₿ CryptoExchange</a><a class="tg" href="/">На главную</a></div></header><main class="order-page"><div class="order-card"><div class="eyebrow">ЗАЯВКА #{{ order_id }}</div><h1>Детали заявки</h1><div id="details">Загрузка…</div></div></main><script>function compact(v,max=8){const n=Number(v);if(!Number.isFinite(n))return '—';return n.toLocaleString('ru-RU',{maximumFractionDigits:max,useGrouping:true})}function money(v,c){return compact(v,(c==='BTC'||c==='ETH')?8:2)+' '+c}async function load(){const r=await fetch('/api/orders/{{ order_id }}');const d=await r.json(),e=document.getElementById('details');if(!d.ok){e.innerHTML='<p>Заявка не найдена.</p>';return}const o=d.order;e.innerHTML=`<div class="bigstatus">${o.status_label}</div><div class="ordergrid"><div>Отдаёте<strong>${money(o.sell_amount,o.sell)}</strong></div><div>Получаете<strong>${money(o.buy_amount,o.buy)}</strong></div><div>Курс<strong>${compact(o.rate,8)} ${o.buy}/${o.sell}</strong></div><div>Комиссия<strong>${money(o.fee,o.buy)}</strong></div></div><div class="address"><small>Тестовый адрес депозита</small><code>${o.deposit_address}</code></div><a class="telegram-link" href="https://t.me/kupiusdtbot?start=order_${o.id}" target="_blank">🔗 Привязать заявку к Telegram</a><p class="demo">После открытия Telegram заявка будет привязана. Реальных переводов выполнять не нужно.</p>`}load();setInterval(load,15000)</script></body></html>
